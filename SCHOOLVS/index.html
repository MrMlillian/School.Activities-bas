<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Multimedia Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="page-title">My Multimedia Page</h1>
  <p class="page-sub">Insert 5 Photos, Audio, and Video</p>
  <hr>

  <!-- ===== Favourite Photo (2 photos) ===== -->
  <div class="content">
    <h3>🌼 Favourite Photo</h3>
    <img src="pics/1.jpg" alt="Favourite Photo 1" class="thumb">
    <img src="pics/3.jpg" alt="Favourite Photo 2" class="thumb">
  </div>

  <!-- ===== Family / Pet Photo (2 photos) ===== -->
  <div class="content">
    <h3>🌷 Family Photo</h3>
    <img src="pics/4.jpg" alt="Family Photo 1" class="thumb">
    <img src="pics/5.jpg" alt="Family Photo 2" class="thumb">
  </div>

  <!-- ===== Hobby Photo (1 photo) = 5 photos total ===== -->
  <div class="content">
    <h3>🌻 Hobby Photo</h3>
    <img src="pics/.jpg" alt="Hobby Photo" class="thumb">
  </div>

  <!-- ===== Music List (Audio) ===== -->
  <div class="content">
    <h3>🎵 Music List</h3>
    <p>1. I Really Want to Stay At Your House - Rosa Walton</p>
    <audio controls src="Music/I Really Want to.mp3"></audio>

    <p>2. Sunflower - Post Malone, Swae Lee</p>
    <audio controls src="Music/Sunflower.mp3"></audio>
  </div>

  <!-- ===== Dream Travel Destination (Video) ===== -->
  <div class="content">
    <h3>🌸 Dream Travel Destination</h3>
    <video controls width="320" src="vids/THE-FOREST-3_480p.mp4"></video>
  </div>

</body>
</html>
